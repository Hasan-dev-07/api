 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #218838;
        }
        #user-card {
            margin-top: 25px;
            padding: 20px;
            border-top: 2px solid #eeeeee;
            text-align: left;
            display: none; /* Hidden by default until data loads */
        }
        .error-message {
            color: #dc3545;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fetch API Practice</h1>
        <p>Click the button below to fetch random user data from a live API.</p>
        
        <button id="fetch-btn">Fetch Random User</button>

        <!-- Container where the API data will be displayed -->
        <div id="user-card">
            <h3 id="user-name"></h3>
            <p><strong>Username:</strong> <span id="user-username"></span></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Company:</strong> <span id="user-company"></span></p>
        </div>
        
        <!-- Container for error handling -->
        <div id="error-div" class="error-message"></div>
    </div>

    <!-- JavaScript block handling the Fetch API -->
    <script>
        document.getElementById('fetch-btn').addEventListener('click', fetchUserData);

        function fetchUserData() {
            // Pick a random user ID between 1 and 10
            const randomId = Math.floor(Math.random() * 10) + 1;
            const apiUrl = `https://typicode.com{randomId}`;
            
            const userCard = document.getElementById('user-card');
            const errorDiv = document.getElementById('error-div');

            // Clear previous errors
            errorDiv.innerText = "";

            // 1. Start the fetch request
            fetch(apiUrl)
                .then(response => {
                    // Check if the server responded with an error (like 404)
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json(); // Convert response stream to JSON object
                })
                .then(data => {
                    // 2. Insert the data into our HTML elements
                    document.getElementById('user-name').innerText = data.name;
                    document.getElementById('user-username').innerText = data.username;
                    document.getElementById('user-email').innerText = data.email;
                    document.getElementById('user-company').innerText = data.company.name;

                    // Make the card container visible
                    userCard.style.display = 'block';
                })
                .catch(error => {
                    // 3. Handle errors if the network or API fails
                    console.error('There was a problem with the fetch operation:', error);
                    errorDiv.innerText = "Failed to load user data. Please try again.";
                    userCard.style.display = 'none';
                });
        }
    </script>
</body>
</html>
